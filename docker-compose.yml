version: '3.8'

services:
  bookmarks-server:
    build: ./docker
    container_name: bookmarks-server
    # Expose port for direct access
    ports:
      - "${PORT:-9080}:9080"
    volumes:
      # Host folders, so the bookmarks are plain files on the server.
      # Set BOOKMARKS_HOME (for example in .env) to keep them somewhere else.
      - ${BOOKMARKS_HOME:-/portainer/Files/AppData/Config/bookmarks}/data:/data/bookmarks:rw
      - ${BOOKMARKS_HOME:-/portainer/Files/AppData/Config/bookmarks}/logs:/data/logs:rw
      - ${BOOKMARKS_HOME:-/portainer/Files/AppData/Config/bookmarks}/config:/app/config:ro
    environment:
      - BOOKMARKS_DIR=/data/bookmarks
      - DEBUG=${DEBUG:-INFO}
      - PORT=9080
      - LOG_FILE=/data/logs/bookmarks-server.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bookmarks-network
    # No reverse proxy labels - use Nginx Proxy Manager web interface for configuration

networks:
  bookmarks-network:
    driver: bridge
 